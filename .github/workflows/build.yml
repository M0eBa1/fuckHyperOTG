name: Build FuckHyperOTG

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK assets'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug and Release APKs
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} artifacts/ \;
          echo "Found APKs:"
          ls -lah artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FuckHyperOTG-debug
          path: artifacts/*debug*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FuckHyperOTG-release
          path: artifacts/*release*.apk
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'FuckHyperOTG v1.0.0' }}
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
